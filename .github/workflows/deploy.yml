name: Push 기반 CI/CD 테스트

on: 
    push:
        branches:
            - main
jobs: 
    cicd:
        runs-on: ubuntu-latest

        steps: 
            - name: 코드 checkout
              uses: actions/checkout@v5
            - name: 소스코드 확인 검증

              run: |
                pwd
                ls -al
                cat main.py
              shell: bash

            - name: sourcecode copy to EC2
              uses: appleboy/scp-action@master
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.EC2_KEY }}
                port: 22
                source: .
                target: "/home/ubuntu/projects"

            - name : Restart Service
              uses : appleboy/ssha-action@master
              with:
              #Ec2 접속 정보
                  host : ${{ secrets.HOST }}
                  username: ${{secrets.USERNAME}}
                  key : ${{secrets.EC2_KEY}}
                  port : 22
                  script : |
                    # 코드가 엄청 증가 => 새로운 패키지 사용해 업데이트 -> 패키지 설치 필요
                    # 가상환경 활성화 => 패키지 설치 추가되어야함.
                    #cd /homne/ubuntu/rpoijects
                    # ./web/bin/pip install -r requirements.txt
                    # rstart : stop -> start
                    sudo systemctl restart hello.service